<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITULO}}</title>
<style>
  :root{
    --bg:#0f1419; --card:#1a2027; --elev:#232b35; --border:#2d3743;
    --tx:#e6e9ef; --tx2:#9ba5b3; --acc:#d95c41;
    --ok:#4ade80; --warn:#fbbf24; --info:#60a5fa; --code:#11151c; --danger:#f87171;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.7; padding:0;
  }
  .wrap{max-width:820px; margin:0 auto; padding:48px 24px 80px}
  header.rep{border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:8px}
  h1{font-size:1.9rem; line-height:1.3; margin:0 0 6px; color:var(--tx)}
  h1 .acc{color:var(--acc)}
  .sub{color:var(--tx2); font-size:.92rem; font-style:italic}
  h2{font-size:1.35rem; line-height:1.3; margin:38px 0 14px; padding-bottom:6px;
     border-bottom:1px solid var(--border); color:var(--tx)}
  h3{font-size:1.05rem; margin:24px 0 8px; color:var(--acc)}
  a{color:var(--info); text-decoration:none}
  a:hover{text-decoration:underline}
  p{margin:10px 0}
  ul,ol{padding-left:22px} li{margin:6px 0}
  code{background:var(--code); padding:2px 6px; border-radius:4px;
       font-family:'SF Mono',Monaco,'Cascadia Code',monospace; font-size:.85em; color:#e6e9ef}
  .tldr{background:var(--elev); border-left:3px solid var(--acc);
        border-radius:8px; padding:14px 18px; margin:18px 0}
  .tldr ul{margin:6px 0}
  .badge{display:inline-block; font-size:.7rem; font-weight:700; padding:1px 7px;
         border-radius:10px; vertical-align:middle; margin-right:6px}
  .badge.nuevo{background:rgba(74,222,128,.15); color:var(--ok)}
  .badge.upd{background:rgba(251,191,36,.15); color:var(--warn)}
  .source{background:var(--card); border:1px solid var(--border);
          border-radius:8px; padding:4px 16px 14px; margin:14px 0}
  .callout{border-radius:8px; padding:12px 16px; margin:16px 0; background:var(--card)}
  .callout.tip{border-left:3px solid var(--info)}
  .callout.warn{border-left:3px solid var(--warn)}
  .callout.ok{border-left:3px solid var(--ok)}
  .callout.danger{border-left:3px solid var(--danger)}
  .callout .lbl{display:block; font-size:.72rem; font-weight:700; text-transform:uppercase;
                letter-spacing:.04em; margin-bottom:4px; color:var(--tx2)}
  .meta-foot{margin-top:48px; padding-top:16px; border-top:1px solid var(--border);
             color:var(--tx2); font-size:.85rem; font-style:italic}
  .action{color:var(--tx2); font-size:.85em}
</style>
</head>
<body>
<div class="wrap">
<header class="rep">
  <h1>{{H1}}</h1>
  <p class="sub">{{SUBTITULO}}</p>
</header>

{{CONTENIDO}}

<p class="meta-foot">{{FOOTER}}</p>
</div>
</body>
</html>
